version: "3.1"

rules:

# ========== REGLAS BÁSICAS ==========

- rule: Siempre saludar cuando el usuario saluda
  steps:
  - intent: saludo
  - action: utter_saludo
  - action: utter_pregunta_inicial

- rule: Siempre despedir cuando el usuario se despide
  steps:
  - intent: despedida
  - action: utter_despedida_suave

- rule: Siempre agradecer cuando el usuario agradece
  steps:
  - intent: agradecer
  - action: utter_agradecer


# ========== REGLAS DE AYUDA URGENTE ==========

- rule: Responder inmediatamente a ayuda urgente
  steps:
  - intent: pedir_ayuda_urgente
  - action: utter_pedir_ayuda_urgente
  - action: utter_recursos


# ========== REGLAS DE CLASIFICACIÓN ==========

- rule: Activar clasificación al relatar situación
  steps:
  - intent: relatar_situacion
  - action: action_clasificar_violencia_mixta
  - action: utter_preguntar_otras_violencias


# ========== REGLAS DE VALIDACIÓN EMOCIONAL ==========

- rule: Validar cuando expresa culpa
  steps:
  - intent: expresar_culpa
  - action: utter_no_es_tu_culpa
  - action: utter_validar_sentimientos

- rule: Validar cuando expresa miedo
  steps:
  - intent: expresar_miedo
  - action: utter_validar_sentimientos
  - action: utter_recursos


# ========== REGLAS DE RECURSOS ==========

- rule: Proveer recursos cuando se piden
  steps:
  - intent: preguntar_recursos
  - action: utter_recursos

- rule: Responder inmediatamente a ayuda urgente
  steps:
  - intent: pedir_ayuda_urgente
  - action: utter_pedir_ayuda_urgente
  - action: utter_recursos


- rule: Dar recursos cuando pide info
  steps:
  - intent: pedir_info_recursos
  - action: utter_recursos

# ========== REGLAS DE TIPOS DE VIOLENCIA ==========

- rule: Explicar tipos de violencia cuando se pregunta
  steps:
  - intent: preguntar_tipos_violencia
  - action: utter_tipos_violencia

- rule: Explicar violencia física
  steps:
  - intent: preguntar_violencia_fisica
  - action: utter_violencia_fisica
  - action: utter_preguntar_otras_violencias

- rule: Explicar violencia psicológica
  steps:
  - intent: preguntar_violencia_psicologica
  - action: utter_violencia_psicologica
  - action: utter_preguntar_otras_violencias

- rule: Explicar violencia sexual
  steps:
  - intent: preguntar_violencia_sexual
  - action: utter_violencia_sexual
  - action: utter_preguntar_otras_violencias

- rule: Explicar violencia económica
  steps:
  - intent: preguntar_violencia_economica
  - action: utter_violencia_economica
  - action: utter_preguntar_otras_violencias

- rule: Explicar violencia simbólica
  steps:
  - intent: preguntar_violencia_simbolica
  - action: utter_violencia_simbolica
  - action: utter_preguntar_otras_violencias





# ========== REGLAS DE ORIENTACIÓN ==========


- rule: Explicar qué hacer cuando se pregunta
  steps:
  - intent: preguntar_que_hacer
  - action: utter_preguntar_como_denunciar

- rule: Explicar directamente cómo denunciar
  steps:
  - intent: preguntar_como_denunciar
  - action: utter_explicar_como_denunciar
  - action: utter_recursos


# ========== REGLAS DE NO ENTENDER ==========

- rule: Responder cuando no se entiende
  steps:
  - intent: no_entender
  - action: utter_no_entender
  - action: utter_tipos_violencia


# ========== REGLAS DE FALLBACK GENÉRICO (OPCIONAL) ==========

# Podés dejar esto comentado si no tenés configurado un intent de fallback.
#- rule: Fallback de NLU
#  steps:
#  - intent: nlu_fallback
#  - action: action_default_fallback
